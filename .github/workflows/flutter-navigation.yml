name: Flutter navigation validation
on:
  push:
    branches: [copilot/dido-map-fixes-improvements]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: navigation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
